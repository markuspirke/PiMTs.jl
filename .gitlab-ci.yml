variables:
  JULIA_DEPOT_PATH: "$CI_PROJECT_DIR/.julia"


cache:
  # Cache the package sources, registries and artifacts but NOT the
  # `compiled/` precompile cache: Julia patch-version changes in the
  # docker image leave behind stale .ji files that brick stdlib loads
  # (LibGit2 / Pkg / MbedTLS_jll). Letting Julia rebuild compiled/ on
  # every run keeps the cache consistent at a small precompile cost.
  paths:
    - $JULIA_DEPOT_PATH/registries
    - $JULIA_DEPOT_PATH/packages
    - $JULIA_DEPOT_PATH/artifacts
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME-v2"


stages:
  - test
  - docs
  - deploy

before_script:
  - mkdir -p /root/.ssh && chmod 700 /root/.ssh
  - cp "$JULIA_REGISTRY_KEY" /root/.ssh/id_rsa
  - chmod 600 /root/.ssh/id_rsa
  - echo "ssh-rsa  julia-ci-readonly" > /root/.ssh/id_rsa.pub
  - |
    cat > /root/.ssh/known_hosts <<'EOF'
    git.ecap.work ssh-rsa 
    git.ecap.work ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBO3yGBgBEVvEGtZoU5qMBTuOXaN+6Xtjo/XG2A+dTncjCLaF0LpmTX9N8vYiIgsTOJmVMc1K0m5bq3ZqY/iLkw0=
    git.ecap.work ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM9+DG53ZbD1bbQ0uDrXj6YXufUfLv3nDHnvONEtiS8p
    EOF


.script:
  script:
    - |
      julia -e '
        using Pkg
        Pkg.update()
        Pkg.Registry.add(RegistrySpec(url = "git@git.ecap.work:common/julia-registry.git"))'

      julia --project=@. -e '
        using Pkg
        Pkg.instantiate()
        Pkg.resolve()
        Pkg.build()
        Pkg.test(coverage=true)'

.coverage:
  coverage: /Test coverage (\d+\.\d+%)/
  after_script:
    - |
      julia -e '
        using Pkg
        Pkg.update()
        Pkg.Registry.add(RegistrySpec(url = "git@git.ecap.work:common/julia-registry.git"))
        Pkg.add("Coverage")
        using Coverage
        c, t = get_summary(process_folder())
        using Printf
        @printf "Test coverage %.2f%%\n" 100c / t'

Julia 1.11:
  image: julia:1.11
  stage: test
  extends:
    - .script
    - .coverage

Julia 1.12:
  image: julia:1.11
  stage: test
  extends:
    - .script
    - .coverage

docs:
  image: julia:1.12
  stage: docs
  script:
    - |
      julia -e '
        using Pkg
        Pkg.update()
        Pkg.Registry.add(RegistrySpec(url = "git@git.ecap.work:common/julia-registry.git"))'
    - |
      julia --project=docs -e '
        using Pkg
        Pkg.update()
        Pkg.instantiate()
        Pkg.resolve()
        using Documenter: doctest
        using PiMTs
        doctest(PiMTs)
        include("docs/make.jl")'
